# NOTE (M0-R1 suggestion): this file lives in deploy/github-ci.yml and is
# NOT picked up by GitHub Actions from here. Copy/move it to
# .github/workflows/ci.yml in the repo for it to actually run.
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # backend/pyproject.toml has no [build-system]/[project] table, so
          # `pip install -e backend/` is not a valid editable install target
          # (M0-R1 blocking #1) -- install the pinned lockfile instead.
          pip install -r backend/requirements.txt
          pip install pytest-cov bandit pip-audit mypy

      - name: Lint with ruff
        run: |
          ruff check backend/
          ruff format --check backend/

      - name: Type check with mypy
        run: |
          mypy backend/app --strict || true
        continue-on-error: true

      - name: Security check with bandit
        run: |
          bandit -r backend/app -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Dependency audit
        run: |
          pip-audit --desc || true
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          pytest backend/tests \
            --cov=backend/app \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=80 \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint with eslint
        run: npm run lint

      - name: Run unit tests with vitest
        run: npm run test:unit -- --coverage

      - name: Build frontend
        run: npm run build

      - name: Security audit
        run: |
          npm audit || true
        continue-on-error: true

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouse-config.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        context:
          - path: backend
            dockerfile: backend/Dockerfile
          - path: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.context.dockerfile }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: openmailroom:${{ matrix.context.path }}
          format: 'sarif'
          output: 'trivy-${{ matrix.context.path }}.sarif'
        continue-on-error: true

      - name: Upload Trivy report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-${{ matrix.context.path }}.sarif'
        continue-on-error: true

  integration:
    name: Integration (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create .env for testing
        run: |
          cat > .env <<ENVEOF
          DATABASE_URL=sqlite:///./data/test.db
          SECRET_KEY=$(openssl rand -base64 32)
          ENCRYPTION_KEY=$(openssl rand -base64 32)
          ADMIN_EMAIL=test@example.com
          ADMIN_PASSWORD=TestPass123!
          DOMAIN=localhost
          LOG_LEVEL=info
          ENVEOF

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost/healthz || curl -sfk https://localhost/healthz; then
              echo "Services healthy"
              exit 0
            fi
            echo "Attempt $i/30: Waiting for services..."
            sleep 4
          done
          echo "Services failed to start"
          docker compose logs
          exit 1

      - name: Health check
        run: |
          curl -sf http://localhost/healthz || curl -sfk https://localhost/healthz
          curl -sf http://localhost/readyz || curl -sfk https://localhost/readyz

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v

  validate-syntax:
    name: Validate Deployment Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          python3 -c "import yaml,sys; yaml.safe_load(open('deploy/docker-compose.yml'))"

      - name: Validate branding.yaml
        run: |
          python3 -c "import yaml,sys; yaml.safe_load(open('config/branding.yaml'))"

      - name: Validate shell scripts
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/selfsigned.sh

      - name: Check .env.example
        run: |
          # Just verify it exists and is readable
          [ -f .env.example ] && echo "✓ .env.example exists"

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker, validate-syntax]
    if: always()
    steps:
      - name: Determine conclusion
        run: |
          if [ "${{ needs.backend.result }}" = "failure" ] || \
             [ "${{ needs.frontend.result }}" = "failure" ] || \
             [ "${{ needs.docker.result }}" = "failure" ] || \
             [ "${{ needs.validate-syntax.result }}" = "failure" ]; then
            echo "CI Pipeline failed"
            exit 1
          fi
          echo "✓ All checks passed"

  # Protection rule: main branch requires all checks to pass
  # Enforce: require-all-status-checks-to-pass
