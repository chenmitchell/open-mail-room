[project]
name = "open-mail-room"
description = "Self-hostable office mailroom system, built for Taiwan offices."
authors = [{ name = "Mitchell Chen", email = "" }]
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"

# Original author and project home: Mitchell Chen
#   https://github.com/chenmitchell/open-mail-room
# Licensed under AGPL-3.0 with an attribution term (see the NOTICE file).

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's `Depends(...)` / `Header(...)` as a default argument is the
# idiomatic, documented pattern for declaring dependencies -- not the
# mutable-default-argument footgun this rule normally guards against.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
